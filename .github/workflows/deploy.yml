name: Deploy Vite Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]  # chaque push sur main relancera le déploiement
  schedule:
    - cron: '0 5 * * *'  # chaque jour à 5 h UTC : ajoute les dépôts GitHub qui ont un portfolio.json
  workflow_dispatch:     # bouton « Run workflow » pour mettre à jour tout de suite

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build  # lance d'abord scripts/fetch-github-projects.mjs (prebuild)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SPA (React routing)
        run: cp dist/index.html dist/404.html || echo "done"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4